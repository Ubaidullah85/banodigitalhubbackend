<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{background-color:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:Arial,sans-serif;overflow-x:hidden;padding:20px;text-align:center}.home-icon{font-size:3rem;margin-bottom:30px;color:#6c5ce7;transition:transform .3s}.home-icon:hover{transform:scale(1.1)}.error-heading{font-size:6rem;font-weight:900;margin-bottom:20px;color:transparent;background:linear-gradient(45deg,#fd79a8,#6c5ce7,#00cec9);-webkit-background-clip:text;background-clip:text;text-shadow:0 0 20px rgba(108,92,231,.4);animation:3s infinite pulse}.sub-heading{font-size:1.5rem;margin-bottom:40px;color:#ddd;max-width:500px;line-height:1.6}.home-button{display:inline-block;padding:15px 35px;background:linear-gradient(45deg,#6c5ce7,#00cec9);color:#fff;text-decoration:none;border-radius:50px;font-weight:700;font-size:1.2rem;transition:.3s;box-shadow:0 5px 15px rgba(108,92,231,.4)}.home-button:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(108,92,231,.6)}.home-button:active{transform:translateY(0)}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}.circle{position:absolute;border-radius:50%;opacity:.2;z-index:-1}.circle-1{width:300px;height:300px;background:linear-gradient(#fd79a8,#6c5ce7);top:10%;left:10%;filter:blur(40px)}.circle-2{width:200px;height:200px;background:linear-gradient(#00cec9,#6c5ce7);bottom:15%;right:15%;filter:blur(30px)}@media (max-width:768px){.error-heading{font-size:4rem}.sub-heading{font-size:1.2rem}}
    </style>
</head>
<body>
    <!-- Decorative background elements -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    
    <!-- Home icon -->
    <a href="#" class="home-icon">
        <i class="fas fa-home"></i>
    </a>
    
    <!-- Main content -->
    <h1 class="error-heading">PAGE 404 | ERROR</h1>
    <p class="sub-heading">The page you're looking for doesn't exist. Go back to the home page.</p>
    
    <!-- Home button -->
    <a href="#" class="home-button">Return Home</a>
    
    <script>
        // Add a subtle interactive effect to the home icon
        document.querySelector('.home-icon').addEventListener('click', function(e) {
            e.preventDefault();
            this.style.transform = 'scale(0.9)';
            setTimeout(() => {
                this.style.transform = '';
                // In a real scenario, this would redirect to home
                alert('Redirecting to home page...');
            }, 300);
        });
        
        // Add interaction to the home button
        document.querySelector('.home-button').addEventListener('click', function(e) {
            e.preventDefault();
            this.style.transform = 'scale(0.95)';
            this.style.boxShadow = '0 2px 10px rgba(108, 92, 231, 0.6)';
            setTimeout(() => {
                // In a real scenario, this would redirect to home
                alert('Redirecting to home page...');
            }, 300);
        });
    </script>
</body>
</html>
