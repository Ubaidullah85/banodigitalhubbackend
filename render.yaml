# Render blueprint — https://render.com/docs/blueprint-spec
#
# In Render: New > Blueprint > pick this repository. Render reads this file and
# creates the service; the four secrets below are the only things it will ask
# you to type, because `sync: false` keeps them out of the repository.
services:
  - type: web
    name: banodigitalhub
    runtime: node
    # Free spins the service down after ~15 minutes idle, so the next visitor
    # waits about a minute for it to wake. Change to `starter` for a site that
    # must always answer immediately.
    plan: free
    # Closest Render region to Pakistan.
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    # `next start` binds to $PORT on its own, which is what Render sets.
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: "22.17.1"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # Public site URL. Every link inside an email, the canonical tags and the
      # sitemap are built from this, so it must be the live domain — see
      # lib/site.js. Set it to the Render URL until the domain is attached.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.banodigitalhub.pk

      - key: MONGODB_DB
        value: banodigitalhub
      - key: GMAIL_USER
        value: banodigitalhub@gmail.com
      - key: MAIL_FROM
        value: Bano Digital Hub <banodigitalhub@gmail.com>
      - key: ADMIN_EMAIL
        value: banodigitalhub@gmail.com

      # Secrets — Render prompts for these; they are never stored in git.
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
